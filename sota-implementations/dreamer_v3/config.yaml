env:
  backend: gym
  name: Pendulum-v1
  task: null
  seed: 0
  use_seed: true
  max_episode_steps: 200
  # Custom factory: package.module:function, called with seed, env_index and num_envs.
  factory: null
  factory_kwargs: {}
  # Strings or lists of nested key components; null disables that observation.
  vector_key: observation
  pixels_key: null
  milestone_key: null
  milestone_names: []

collector:
  backend: sync  # one of: sync, async
  async_env_backend: threading  # one of: threading, multiprocessing
  env_exchange: queue
  envs_per_worker: 1
  policy_device: null
  inference_max_batch_size: null  # null uses num_envs
  inference_min_batch_size: 1
  inference_timeout: 0.01
  inference_static_batch_size: null
  # Where the acting policy is served. "thread": the inference server runs in a
  # thread of this process and coordinator threads relay observations and
  # actions. "process": a dedicated inference process reads each environment
  # worker's shared-memory slot directly, so nothing crosses the driver on the
  # action path; needs async_env_backend=multiprocessing and envs_per_worker=1.
  inference_backend: thread
  num_envs: 1
  frames_per_batch: 200
  total_frames: 5000
  count_reset_records: false
  exploration: random  # one of: random, mode

replay_buffer:
  device: cpu  # null keeps replay on the training device
  buffer_size: 10000
  batch_size: 16
  seq_len: 16
  online: true
  warmup_factor: 2  # collect (warmup_factor * batch_size * seq_len) frames before training

networks:
  rnn_hidden_dim: 32
  num_categoricals: 4
  num_classes: 4
  unimix: 0.01
  recurrent_model: block_gru
  num_blocks: 8
  dynamics_layers: 1
  prior_layers: 2
  posterior_layers: 1
  norm_eps: 1.0e-4
  # Sizes of the per-observation decoder heads, summing to the observation
  # size. null builds a single head over the whole observation.
  decoder_event_dims: null
  num_reward_bins: 255
  num_value_bins: 255
  hidden_dim: 64
  encoder_layers: 3
  decoder_layers: 3
  reward_layers: 1
  actor_layers: 3
  value_layers: 3
  policy_min_std: 0.1
  policy_max_std: 1.0
  image_depth: 64
  image_mults: [2, 3, 4, 4]
  image_kernel_size: 5
  image_decoder_blocks: 8

optimization:
  device: null       # training device (models, losses, policy). null=auto
  deferred_policy_sync: false
  separate_policy_rng: false
  mixed_precision: false
  # Compile the RSSM recurrence: null, "step" or "scan". "scan" is faster but
  # changes the random stream; see the README.
  compile_rssm: null
  # Number of RSSM steps traced per higher-order scan iteration.
  rssm_scan_unroll: 8
  # Compile the complete learner forward/backward with TorchInductor.
  compile_train_step: false
  # torch.compile mode for the complete learner step.
  compile_train_step_mode: default
  # Capture the fixed-shape learner forward/backward on CUDA after warmup.
  cudagraph_train_step: false
  # Synchronize CUDA around train-update timing. This disables CPU/GPU overlap.
  sync_timers: false
  collection_warmup_seconds: 0
  max_time: null  # wall-clock seconds; null uses the frame budget
  # Saving is opt-in. Resume only when resume_from is explicitly set.
  checkpoint_dir: null
  checkpoint_every: 1000  # completed learner updates; null saves only at exit
  checkpoint_keep_last: 2
  checkpoint_include_replay: false
  resume_from: null  # checkpoint or rotation directory
  lr: 4.0e-5
  optimizer_eps: 1.0e-20
  adaptive_grad_clip: 0.3
  warmup_steps: 1000
  updates_per_batch: 8
  train_ratio: null
  imagination_horizon: 15
  continuation_horizon: 333
  use_reinforce: true
  return_normalization_rate: 0.01
  return_normalization_min_scale: 1.0
  slow_critic_regularization: 1.0
  slow_critic_tau: 0.02
  replay_value_loss_weight: 0.3
  free_bits: 1.0
  dynamic_loss_weight: 1.0
  representation_loss_weight: 0.1
  gamma: 1.0
  lmbda: 0.95

logger:
  train_every: 200
  eval_every: 500
  eval_episodes: 3
  output_plot: dreamer_v3_pendulum.png
  metrics_jsonl: null
  backend: null  # null, csv, tensorboard or wandb
  log_dir: logs
  project: torchrl-dreamer-v3
  entity: null
  base_url: null
  exp_name: null
  group: null
  tags: []
  mode: online

hydra:
  job:
    chdir: true
