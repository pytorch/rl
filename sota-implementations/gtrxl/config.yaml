seed: 0
num_threads: 1
device: cpu
network:
  container: ttd
  hidden_size: 32
  num_layers: 2
  num_heads: 4
  memory_len: 16
env:
  num_envs: 16
collector:
  steps_per_batch: 128
  total_frames: 500000
replay:
  window_length: 32
  batch_size: 16
  storage: tensor
  scratch_dir: null
loss:
  epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.01
optim:
  lr: 0.0003
  max_grad_norm: 0.5
logger:
  backend: null
  eval_interval: 50000
  eval_envs: 4
  output: outputs/gtrxl/metrics.json
hydra:
  job:
    chdir: false
  run:
    dir: outputs/gtrxl/${now:%Y-%m-%d}/${now:%H-%M-%S}
