env:
  name: HalfCheetah-v4
  task: ""
  library: gymnasium
  max_episode_steps: 1000
  seed: 42

collector:
  total_frames: 1_000_000
  init_random_frames: 25_000
  frames_per_batch: 1000
  device:
  env_per_collector: 8

replay_buffer:
  size: 1_000_000
  prb: False
  scratch_dir:

optim:
  utd_ratio: 1.0
  gamma: 0.99
  lr: 3.0e-4
  weight_decay: 0.0
  batch_size: 256
  target_update_polyak: 0.995
  alpha_init: 1.0
  adam_eps: 1.0e-8

network:
  actor_hidden_sizes: [256, 256]
  critic_hidden_sizes: [512, 512, 512]
  activation: relu
  default_policy_scale: 1.0
  scale_lb: 0.1
  device:

loss:
  num_qvalue_nets: 5
  num_quantiles: 25
  top_quantiles_to_drop_per_net: 2

logger:
  backend: wandb
  project_name: torchrl_example_tqc
  group_name: null
  exp_name: ${env.name}_TQC
  mode: online
  eval_iter: 25_000
  video: False

compile:
  compile: False
  compile_mode:
  cudagraphs: False

hydra:
  job:
    chdir: true
