# Hydra configuration of examples/microduck/ppo_mujoco.py.
# Every field is an override, e.g. `python ppo_mujoco.py env.download=true smoke=true`.

env:
  microduck_root: null      # microduck_rl checkout; MICRODUCK_RL_ROOT or `download` otherwise
  root: null                # cache directory for downloads (~/.cache/torchrl/microduck)
  download: false
  backend: mujoco-torch     # mujoco-torch and mjx vectorize num_envs simulators; mujoco runs one process per env
  num_envs: 1024
  parallel: true            # mujoco only: ParallelEnv (false: SerialEnv)
  compile_step: false       # torch.compile the mujoco-torch physics step
  device: null              # null picks CUDA when available, else CPU
  seed: 0
  max_episode_steps: 500
  camera_id: -1             # rendering: MuJoCo camera and frame size
  render_width: 640
  render_height: 480
  action_scale: 1.0         # position-target offset in radians for a unit action (0.35 with the gait prior)
  diagnostics: false        # reward breakdown in the observation; evaluators turn it on
  tasks:                    # task library: one MicroDuckEnv preset per entry with its arguments (`weight`, `name`, ...)
    - {preset: tracking_task, speed: 0.03}
  task_id: null             # pin one task of the library at every reset (evaluation, rendering)

policy:
  from_prior: false         # true: quick debugging start, a bounded residual around the closed-form gait
  hidden_size: 128
  residual_scale: 0.2       # bound of the learned residual when starting from the prior
  initial_policy_scale: null  # exploration std at start: 1.0 from scratch, 0.05 from the prior
  init_from: null           # checkpoint whose actor and critic parameters initialize the models

ppo:
  total_transitions: 10_000_000
  transitions_per_update: 16_384
  epochs: 5
  minibatch_trajectories: 32
  learning_rate: 1e-4
  target_kl: 0.01           # null disables the KL-adaptive learning rate
  entropy_coeff: 0.0
  critic_coeff: 0.5
  gamma: 0.99
  gae_lambda: 0.95
  max_grad_norm: 1.0
  per_task_advantage: true  # standardize advantages within each task of the library

evaluation:
  interval: 5               # iterations between deterministic evaluations; null disables them
  num_episodes: 8           # complete episodes per task and evaluation
  steps: 500
  best_checkpoint_path: microduck_ppo_best.ckpt
  latest_checkpoint_path: null
  video:                    # 2x2 grid of four tasks filmed in parallel, logged with the evaluation metrics
    interval: null          # log at every N-th evaluation; null disables it (video storage is not free)
    tasks: [1, 2, 3, 5]     # library indices of the four tiles, row-major
    steps: 250              # frames at 50 Hz
    width: 320
    height: 240

logger:
  backend: wandb            # wandb | csv | tensorboard | null
  project: torchrl-microduck-ppo
  entity: null              # required for wandb so runs never land in a default workspace
  exp_name: null
  mode: online              # wandb mode: online | offline | disabled

smoke: false                # tiny pipeline check
