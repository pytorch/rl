name: MicroDuck zoo integration

on:
  pull_request:
    paths:
      - "torchrl/envs/custom/mujoco/**"
      - "torchrl/envs/__init__.py"
      - "torchrl/trainers/**"
      - "torchrl/objectives/ppo.py"
      - "examples/microduck/**"
      - "test/libs/test_mujoco.py"
      - "tutorials/sphinx-tutorials/microduck_games.py"
      - ".github/workflows/test-microduck-zoo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: egl
      MAX_JOBS: "2"
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.14.0.dev0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri ffmpeg
      - run: python -m pip install torch==2.11.0 torchcodec==0.16.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'tensordict==0.14.2' 'mujoco==3.10.0' 'hydra-core>=1.3,<1.4' 'torchcodec==0.16.0' 'pybind11[global]' setuptools wheel ninja pyvers hoptorch
      - name: Install this TorchRL revision and the pinned optional zoo
        run: |
          python -m pip install --no-build-isolation .
          python -m pip install 'torchrl-zoo @ https://github.com/vmoens/rl-zoo/archive/d9b68f5c72ec29c1627c3126638609b1b2f76740.zip'
      - name: Execute the installed-package tutorial
        working-directory: /tmp
        timeout-minutes: 3
        run: |
          python -c "import importlib.util; import torchrl; import torchrl_zoo; assert importlib.util.find_spec('examples') is None"
          python "$GITHUB_WORKSPACE/tutorials/sphinx-tutorials/microduck_games.py"
      - name: Smoke the prior PPOTrainer recipes
        timeout-minutes: 3
        run: |
          python -m examples.microduck.ppo_mujoco env.download=true smoke=true algorithm=ppo save_trainer_file=/tmp/prior-ppo.ckpt
          python -m examples.microduck.ppo_mujoco env.download=true smoke=true algorithm=ppo_ewma save_trainer_file=/tmp/prior-ewma.ckpt
      - name: Smoke the sensor prior PPOTrainer recipe
        timeout-minutes: 3
        run: |
          python -m examples.microduck.ppo_mujoco env.download=true smoke=true observations=proprioception_vision algorithm=ppo_ewma save_trainer_file=/tmp/prior-sensors.ckpt
      - name: Smoke the installed visual game consumer
        working-directory: /tmp
        timeout-minutes: 5
        run: |
          python -m torchrl_zoo.microduck.train game=tag observations=proprioception_vision algorithm=ppo_ewma observations.sensors.image_size=32 observations.sensors.camera_fps=10 env.download=true smoke=true
