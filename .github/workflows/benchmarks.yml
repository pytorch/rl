name: Continuous Benchmark
# The short, pinned async suite runs on relevant main merges. The full suite
# remains nightly. Manual branch runs produce artifacts without changing trends.
on:
  pull_request:
    paths:
      - '.github/scripts/*benchmark*.py'
      - '.github/workflows/benchmarks.yml'
  push:
    branches: [main]
    paths:
      - 'torchrl/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
      - '.github/async-benchmark-requirements.txt'
      - '.github/scripts/summarize_async_benchmarks.py'
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        type: choice
        options: [async, full]
        default: async
      skip-upload:
        description: Keep results as artifacts only
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip-upload:
        description: 'Skip benchmark upload to gh-pages'
        type: boolean
        default: false

permissions:
  id-token: write
  deployments: write
  contents: write

concurrency:
  # Keep every merge's measurements, even when several runs overlap.
  group: benchmarks-${{ github.run_id }}
  cancel-in-progress: false

env:
  BENCHMARK_SUITE: ${{ github.event_name == 'push' && 'async' || inputs.suite || 'full' }}
  PYTHONHASHSEED: '0'


jobs:
  validate-report:
    name: Validate benchmark reporting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
      - run: python -m pip install 'pytest==9.1.1'
      - run: python -m pytest .github/scripts/test_pr_benchmark_workflow.py -q

  benchmark:
    if: github.event_name != 'pull_request'
    needs: validate-report
    name: ${{ matrix.device }} Pytest benchmark
    runs-on: linux.g5.4xlarge.nvidia.gpu
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: GPU
            image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04@sha256:b3e7fba84d169f46939f00c25be7d016f712a8d651f4756d6a55e693d84d94f2
    defaults:
      run:
        shell: bash -l {0}
    container:
      image: ${{ matrix.image }}
      options: --gpus all --shm-size=8g
    steps:
      - name: Who triggered this?
        run: |
          echo "Action triggered by ${{ github.event_name }} on ${{ github.ref }}"
      - name: Check ldd --version
        run: ldd --version
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50 # this is to make sure we obtain the target base commit
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
      - name: Setup Environment
        run: |
          export TZ=Europe/London
          export DEBIAN_FRONTEND=noninteractive  # tzdata bug
          if [ "$BENCHMARK_SUITE" = async ]; then
            # Resolve OS dependencies against the same archive on every merge.
            # See https://snapshot.ubuntu.com/ for the Jammy snapshot syntax.
            cat > /tmp/benchmark-sources.list <<'APT'
          deb [snapshot=20260907T000000Z] http://archive.ubuntu.com/ubuntu/ jammy main universe
          deb [snapshot=20260907T000000Z] http://archive.ubuntu.com/ubuntu/ jammy-updates main universe
          deb [snapshot=20260907T000000Z] http://security.ubuntu.com/ubuntu/ jammy-security main universe
          APT
            APT_OPTIONS=(-o Dir::Etc::sourcelist=/tmp/benchmark-sources.list -o Dir::Etc::sourceparts=-)
            apt-get "${APT_OPTIONS[@]}" update
            apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends \
              git gcc g++ make cmake libpython3.10-dev
          else
            apt-get update -y
            apt-get install software-properties-common cmake -y
            add-apt-repository ppa:git-core/candidate -y
            apt-get update -y
            apt-get upgrade -y
            apt-get -y install libglu1-mesa libgl1-mesa-glx libosmesa6 gcc curl g++ unzip wget libglfw3-dev libgles2-mesa-dev libglew-dev sudo git cmake libz-dev libpython3.10-dev
          fi
          dpkg-query -W -f='${Package}=${Version}\n' | sort > benchmarks/system-packages.txt
      - name: Setup git
        run: |
          git config --global --add safe.directory /__w/rl/rl
          git config --global user.name "github-action-benchmark"
          git config --global user.email "github@users.noreply.github.com"
      - name: setup Path
        run: |
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Cache pinned async dependencies
        if: env.BENCHMARK_SUITE == 'async'
        uses: actions/cache@v4
        with:
          path: .async-benchmark-venv
          key: async-benchmark-v1-${{ runner.os }}-${{ matrix.device }}-${{ hashFiles('.github/async-benchmark-requirements.txt', '.github/workflows/benchmarks.yml') }}
      - name: Run
        id: measure
        run: |
          set -euxo pipefail
          if [ "$BENCHMARK_SUITE" = async ]; then
            export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
            if [ ! -f .async-benchmark-venv/complete ]; then
              python -m venv .async-benchmark-venv
              source .async-benchmark-venv/bin/activate
              python -m pip install 'pip==26.1.2'
              python -m pip install --pre -r .github/async-benchmark-requirements.txt \
                --extra-index-url https://download.pytorch.org/whl/cu126
              python -m pip install --no-deps --no-build-isolation \
                'tensordict @ git+https://github.com/pytorch/tensordict@faee822038b54b7b90762820b1f0a4ee37ade59d'
              python -m pip check
              touch .async-benchmark-venv/complete
            fi
            source .async-benchmark-venv/bin/activate
          else
            python -m venv ./py310
            source ./py310/bin/activate
          fi
          export PYTHON_INCLUDE_DIR=/usr/include/python3.10
          export TORCHRL_BENCHMARK_DEVICE="${{ matrix.device }}"
          if [ "${TORCHRL_BENCHMARK_DEVICE}" = "CPU" ]; then
            export CUDA_VISIBLE_DEVICES=
          fi

          if [ "$BENCHMARK_SUITE" = full ]; then
            # Resolve a matching nightly pair from the live cu126 channel. The
            # latest torch and torchvision wheels can have different build dates.
            # Install the vision wheel first without dependencies, then honor its
            # exact torch requirement so resolution cannot fall back to stable.
            # PyPI supplies dependencies absent from the nightly wheel index.
            python -m pip install --pre torchvision --index-url https://download.pytorch.org/whl/nightly/cu126 --no-deps -U
            python -c "import importlib.metadata; print('\n'.join(importlib.metadata.requires('torchvision')))" > /tmp/torchvision-requirements.txt
            python -m pip install --pre -r /tmp/torchvision-requirements.txt \
              --index-url https://download.pytorch.org/whl/nightly/cu126 --extra-index-url https://pypi.org/simple
            python -m pip freeze | grep -E '^(torch|torchvision)==' > /tmp/torch-constraints.txt
            python -m pip install -c /tmp/torch-constraints.txt ninja pytest pytest-benchmark pytest-timeout "hoptorch>=0.1.4" "mujoco>=3.8.1,<3.9.0" "dm_control>=1.0.41" "gym[accept-rom-license,atari]" transformers accelerate
            python -m pip install -c /tmp/torch-constraints.txt "pybind11[global]"
            python -m pip install -c /tmp/torch-constraints.txt cloudpickle packaging importlib_metadata numpy orjson "pyvers>=0.2.3,<0.3.0"
            python -m pip install --no-deps git+https://github.com/pytorch/tensordict
            python -m pip install -c /tmp/torch-constraints.txt safetensors tqdm pandas numpy matplotlib ray psutil

            bash .github/unittest/helpers/assert_torch_version.sh nightly
            bash .github/unittest/helpers/assert_torch_tensordict_versions.sh nightly

            # As in the pinned setup above, validate the third-party environment
            # before adding this checkout. TensorDict main's development base
            # version can precede TorchRL's stable release floor; this suite
            # tests source compatibility separately from that metadata check.
            python -m pip check
          fi
          python -m pip install -e . --no-build-isolation --no-deps
          python -m pip freeze --all > benchmarks/dependencies.txt

          if [ "${{ matrix.device }}" = "GPU" ]; then
            # test import and fail early if the GPU runner did not expose CUDA
            nvcc --version
            nvidia-smi --query-gpu=name,driver_version --format=csv > benchmarks/gpu.txt
            python -c "import torch; assert torch.cuda.device_count()"
            python -c "import torchrl._torchrl as ext; assert hasattr(ext, 'CudaSumSegmentTreeFp32')"
            python -m pytest test/test_inference_server.py -q -m gpu --timeout=180
          fi

          cd benchmarks/
          export TORCHDYNAMO_INLINE_INBUILT_NN_MODULES=1
          export COMPOSITE_LP_AGGREGATE=0
          export TD_GET_DEFAULTS_TO_NONE=1
          BENCHMARK_SITE_DIR="$(mktemp -d)"
          cat > "${BENCHMARK_SITE_DIR}/sitecustomize.py" <<'PY'
          import warnings

          try:
              import torch

              torch._dynamo.config.reorderable_logging_functions.add(warnings.warn)
          except (AttributeError, ImportError):
              pass
          PY
          export PYTHONPATH="${BENCHMARK_SITE_DIR}${PYTHONPATH:+:${PYTHONPATH}}"
          if [ "$BENCHMARK_SUITE" = async ]; then
            # Repeat in fresh processes; retain all round samples and each run's JSON.
            for repeat in 1 2 3; do
              python -m pytest -v --rank 0 --timeout=300 --benchmark-only \
                --benchmark-save-data --benchmark-json "async-${repeat}.json" \
                test_envs_benchmark.py test_collectors_benchmark.py \
                -k 'async_collection_pixels and (async-process-slots or async-shm-grouped or async-shm-integrated)'
            done
          else
            python -m pytest -vvv --rank 0 --timeout=240 --benchmark-only \
              --benchmark-json output.json --ignore test_llm.py .
          fi
          touch success.txt

      - name: Summarize async measurements
        if: ${{ !cancelled() && env.BENCHMARK_SUITE == 'async' }}
        run: |
          python .github/scripts/summarize_async_benchmarks.py benchmarks \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.device }}-benchmark-results
          path: |
            benchmarks/*.json
            benchmarks/dependencies.txt
            benchmarks/system-packages.txt
            benchmarks/gpu.txt
            benchmarks/success.txt
          retention-days: 30
          if-no-files-found: warn

  benchmark-upload:
    name: Upload benchmark results
    runs-on: ubuntu-latest
    needs: benchmark
    # One failed device must not suppress another device's successful history.
    # Branch/manual validation never enters the main trend.
    if: ${{ !cancelled() && !inputs.skip-upload && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-benchmark-results'
          path: results
      - name: Store CPU benchmark results
        if: ${{ !cancelled() && hashFiles('results/CPU-benchmark-results/success.txt') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ env.BENCHMARK_SUITE == 'async' && 'Async CPU (v1)' || 'CPU Benchmark Results' }}
          tool: ${{ env.BENCHMARK_SUITE == 'async' && 'customBiggerIsBetter' || 'pytest' }}
          output-file-path: results/CPU-benchmark-results/${{ env.BENCHMARK_SUITE == 'async' && 'trend.json' || 'output.json' }}
          benchmark-data-dir-path: ${{ env.BENCHMARK_SUITE == 'async' && 'dev/bench/async' || 'dev/bench' }}
          fail-on-alert: true
          alert-threshold: '200%'
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          auto-push: true
          max-items-in-chart: 250
      - name: Store GPU benchmark results
        if: ${{ !cancelled() && hashFiles('results/GPU-benchmark-results/success.txt') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ env.BENCHMARK_SUITE == 'async' && 'Async GPU (v1)' || 'GPU Benchmark Results' }}
          tool: ${{ env.BENCHMARK_SUITE == 'async' && 'customBiggerIsBetter' || 'pytest' }}
          output-file-path: results/GPU-benchmark-results/${{ env.BENCHMARK_SUITE == 'async' && 'trend.json' || 'output.json' }}
          benchmark-data-dir-path: ${{ env.BENCHMARK_SUITE == 'async' && 'dev/bench/async' || 'dev/bench' }}
          fail-on-alert: true
          alert-threshold: '200%'
          comment-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          auto-push: true
          max-items-in-chart: 250
