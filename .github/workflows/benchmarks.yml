name: Continuous Benchmark
# The short, pinned async suite runs on relevant main merges. The full suite
# remains nightly. Manual branch runs produce artifacts without changing trends.
on:
  pull_request:
    paths:
      - '.github/scripts/*benchmark*.py'
      - '.github/workflows/benchmarks.yml'
  push:
    branches: [main]
    paths:
      - 'torchrl/**'
      - 'benchmarks/**'
      - 'sota-implementations/dreamer_v3/**'
      - '.github/workflows/benchmarks.yml'
      - '.github/async-benchmark-requirements.txt'
      - '.github/scripts/summarize_async_benchmarks.py'
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        type: choice
        options: [async, full]
        default: async
      skip-upload:
        description: Keep results as artifacts only
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip-upload:
        description: 'Skip benchmark upload to gh-pages'
        type: boolean
        default: false

permissions:
  id-token: write
  deployments: write
  contents: write

concurrency:
  # Keep every merge's measurements, even when several runs overlap.
  group: benchmarks-${{ github.run_id }}
  cancel-in-progress: false

env:
  BENCHMARK_SUITE: ${{ github.event_name == 'push' && 'async' || inputs.suite || 'full' }}
  PYTHONHASHSEED: '0'


jobs:
  validate-report:
    name: Validate benchmark reporting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
      - run: python -m pip install 'pytest==9.1.1'
      - run: python -m pytest .github/scripts/test_pr_benchmark_workflow.py -q

  benchmark:
    if: github.event_name != 'pull_request'
    needs: validate-report
    name: ${{ matrix.device }} Pytest benchmark${{ matrix.python != '3.10.20' && format(' (Python {0})', matrix.python) || '' }}
    runs-on: mt-l-x86aavx2-11-41-a10g
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Pushes and manual async runs keep the existing Python 3.10 suite.
        python: ${{ fromJSON((github.event_name == 'push' || inputs.suite == 'async') && '["3.10.20"]' || '["3.10.20","3.12.16"]') }}
        device: [CPU, GPU]
        include:
          - device: CPU
            image: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu22.04@sha256:5f0d2d827f6436b3cb7468fd8acbdc8c1d41261614e579ae49afe6141da51133
          - device: GPU
            image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04@sha256:b3e7fba84d169f46939f00c25be7d016f712a8d651f4756d6a55e693d84d94f2
    defaults:
      run:
        shell: bash -l {0}
    container:
      image: ${{ matrix.image }}
      options: --gpus all --shm-size=8g
    env:
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BENCHMARK_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - name: Who triggered this?
        run: |
          echo "Action triggered by ${{ github.event_name }} on ${{ github.ref }}"
      - name: Check ldd --version
        run: ldd --version
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50 # this is to make sure we obtain the target base commit
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Environment
        run: |
          export TZ=Europe/London
          export DEBIAN_FRONTEND=noninteractive  # tzdata bug
          if [ "$BENCHMARK_SUITE" = async ]; then
            # Resolve OS dependencies against the same archive on every merge.
            # See https://snapshot.ubuntu.com/ for the Jammy snapshot syntax.
            cat > /tmp/benchmark-sources.list <<'APT'
          deb [snapshot=20260907T000000Z] http://archive.ubuntu.com/ubuntu/ jammy main universe
          deb [snapshot=20260907T000000Z] http://archive.ubuntu.com/ubuntu/ jammy-updates main universe
          deb [snapshot=20260907T000000Z] http://security.ubuntu.com/ubuntu/ jammy-security main universe
          APT
            APT_OPTIONS=(-o Dir::Etc::sourcelist=/tmp/benchmark-sources.list -o Dir::Etc::sourceparts=-)
            # The snapshot service answers 502/503 intermittently. A failed
            # install left git missing and failed every later step of the
            # push-triggered runs, so retry before giving up.
            for attempt in 1 2 3 4 5 6; do
              if apt-get "${APT_OPTIONS[@]}" update \
                && apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends \
                  git gcc g++ make cmake libpython3.10-dev; then
                break
              fi
              if [ "$attempt" = 6 ]; then
                echo "Installing system packages from the snapshot failed after $attempt attempts" >&2
                exit 1
              fi
              sleep 30
            done
            command -v git
          else
            apt-get update -y
            apt-get install software-properties-common cmake -y
            add-apt-repository ppa:git-core/candidate -y
            apt-get update -y
            apt-get upgrade -y
            apt-get -y install libglu1-mesa libgl1-mesa-glx libosmesa6 gcc curl g++ unzip wget libglfw3-dev libgles2-mesa-dev libglew-dev sudo git cmake libz-dev libpython3.10-dev
          fi
          dpkg-query -W -f='${Package}=${Version}\n' | sort > benchmarks/system-packages.txt
      - name: Setup git
        run: |
          git config --global --add safe.directory /__w/rl/rl
          git config --global user.name "github-action-benchmark"
          git config --global user.email "github@users.noreply.github.com"
      - name: setup Path
        run: |
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Cache pinned async dependencies
        if: env.BENCHMARK_SUITE == 'async'
        uses: actions/cache@v4
        with:
          path: .async-benchmark-venv
          key: async-benchmark-v1-${{ runner.os }}-${{ matrix.device }}-${{ hashFiles('.github/async-benchmark-requirements.txt', '.github/workflows/benchmarks.yml') }}
      - name: Run
        id: measure
        run: |
          set -euxo pipefail
          if [ "$BENCHMARK_SUITE" = async ]; then
            export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
            if [ ! -f .async-benchmark-venv/complete ]; then
              python -m venv .async-benchmark-venv
              source .async-benchmark-venv/bin/activate
              python -m pip install 'pip==26.1.2'
              python -m pip install --pre -r .github/async-benchmark-requirements.txt \
                --extra-index-url https://download.pytorch.org/whl/cu126
              python -m pip install --no-deps --no-build-isolation \
                'tensordict @ git+https://github.com/pytorch/tensordict@faee822038b54b7b90762820b1f0a4ee37ade59d'
              python -m pip check
              touch .async-benchmark-venv/complete
            fi
            source .async-benchmark-venv/bin/activate
          else
            if [[ "$BENCHMARK_PYTHON_VERSION" == 3.10.* ]]; then
              python -m venv ./py310
              source ./py310/bin/activate
            else
              python -m venv ./pybenchmark
              source ./pybenchmark/bin/activate
            fi
          fi
          if [[ "$BENCHMARK_PYTHON_VERSION" == 3.10.* ]]; then
            export PYTHON_INCLUDE_DIR=/usr/include/python3.10
          else
            export PYTHON_INCLUDE_DIR="$(python -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          fi
          export TORCHRL_BENCHMARK_DEVICE="${{ matrix.device }}"
          if [ "${TORCHRL_BENCHMARK_DEVICE}" = "CPU" ]; then
            export CUDA_VISIBLE_DEVICES=
          fi

          if [ "$BENCHMARK_SUITE" = full ]; then
            torch_python_tag="$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')"
            if [[ "$BENCHMARK_PYTHON_VERSION" == 3.10.* ]]; then
              gym_requirements=('gym[accept-rom-license,atari]')
            else
              # ALE 0.8 has no Python 3.12 wheel; ALE 0.9 uses Gymnasium.
              gym_requirements=('gym==0.26.2' 'gymnasium==1.2.3' 'ale-py==0.9.1')
            fi
            # TODO: Remove these pins and return to current nightlies after
            # deprecating the CUDA 12.6 benchmark job in favor of a newer CUDA.
            # Install torchvision without dependencies, then honor its exact torch
            # requirement. The matching torch wheel is no longer in the index.
            python -m pip install --pre 'torchvision==0.30.0.dev20260906+cu126' --index-url https://download.pytorch.org/whl/nightly/cu126 --no-deps -U
            python -c "import importlib.metadata; print('\n'.join(importlib.metadata.requires('torchvision')))" > /tmp/torchvision-requirements.txt
            python -m pip install --pre -r /tmp/torchvision-requirements.txt \
              "torch @ https://download-r2.pytorch.org/whl/nightly/cu126/torch-2.15.0.dev20260906%2Bcu126-${torch_python_tag}-${torch_python_tag}-manylinux_2_28_x86_64.whl" \
              --index-url https://download.pytorch.org/whl/nightly/cu126 --extra-index-url https://pypi.org/simple
            python -c "import importlib.metadata as m; print('torch==' + m.version('torch')); print('torchvision==' + m.version('torchvision'))" > /tmp/torch-constraints.txt
            python -m pip install -c /tmp/torch-constraints.txt ninja pytest pytest-benchmark pytest-timeout "hoptorch>=0.1.4" "mujoco>=3.8.1,<3.9.0" "dm_control>=1.0.41" "${gym_requirements[@]}" transformers accelerate
            python -m pip install -c /tmp/torch-constraints.txt "pybind11[global]"
            python -m pip install -c /tmp/torch-constraints.txt cloudpickle packaging importlib_metadata numpy 'orjson; python_version < "3.13"' "pyvers>=0.2.3,<0.3.0"
            python -m pip install --no-deps git+https://github.com/pytorch/tensordict
            python -m pip install -c /tmp/torch-constraints.txt safetensors tqdm pandas numpy matplotlib ray psutil hydra-core omegaconf

            bash .github/unittest/helpers/assert_torch_version.sh nightly
            bash .github/unittest/helpers/assert_torch_tensordict_versions.sh nightly

            # As in the pinned setup above, validate the third-party environment
            # before adding this checkout. TensorDict main's development base
            # version can precede TorchRL's stable release floor; this suite
            # tests source compatibility separately from that metadata check.
            python -m pip check
          fi
          python -m pip install -e . --no-build-isolation --no-deps
          python -m pip freeze --all > benchmarks/dependencies.txt
          {
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "nproc: $(nproc)"
            echo "cgroup cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable)"
            echo "cpu model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            python -c "import tensordict, torch; print(f'torch: {torch.__version__}'); print(f'torch threads: {torch.get_num_threads()}'); print(f'tensordict: {tensordict.__version__}')"
          } > benchmarks/machine.txt
          {
            echo "### ${{ matrix.device }} benchmark machine"
            echo '```'
            cat benchmarks/machine.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ matrix.device }}" = "GPU" ]; then
            # test import and fail early if the GPU runner did not expose CUDA
            nvcc --version
            nvidia-smi --query-gpu=name,driver_version --format=csv > benchmarks/gpu.txt
            python -c "import torch; assert torch.cuda.device_count()"
            python -c "import torchrl._torchrl as ext; assert hasattr(ext, 'CudaSumSegmentTreeFp32')"
          fi

          cd benchmarks/
          export TORCHDYNAMO_INLINE_INBUILT_NN_MODULES=1
          export COMPOSITE_LP_AGGREGATE=0
          export TD_GET_DEFAULTS_TO_NONE=1
          BENCHMARK_SITE_DIR="$(mktemp -d)"
          cat > "${BENCHMARK_SITE_DIR}/sitecustomize.py" <<'PY'
          import warnings

          try:
              import torch

              torch._dynamo.config.reorderable_logging_functions.add(warnings.warn)
          except (AttributeError, ImportError):
              pass
          PY
          export PYTHONPATH="${BENCHMARK_SITE_DIR}${PYTHONPATH:+:${PYTHONPATH}}"
          if [ "$BENCHMARK_SUITE" = async ]; then
            # Repeat in fresh processes; retain all round samples and each run's JSON.
            for repeat in 1 2 3; do
              python -m pytest -v --rank 0 --timeout=300 --benchmark-only \
                --benchmark-save-data --benchmark-json "async-${repeat}.json" \
                test_envs_benchmark.py test_collectors_benchmark.py \
                test_dreamer_v3_benchmark.py \
                -k 'async_env_pool or async_collection_pixels or dreamer_v3_async'
            done
          else
            python -m pytest -vvv --rank 0 --timeout=240 --benchmark-only \
              --benchmark-json output.json --ignore test_llm.py \
              -k 'not async_collection_pixels_64_envs and not 64-processes' .
          fi
          touch success.txt

      - name: Summarize async measurements
        if: ${{ !cancelled() && env.BENCHMARK_SUITE == 'async' }}
        run: |
          python .github/scripts/summarize_async_benchmarks.py benchmarks \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.device }}-benchmark-results${{ matrix.python != '3.10.20' && format('-py{0}', matrix.python) || '' }}
          path: |
            benchmarks/*.json
            benchmarks/dependencies.txt
            benchmarks/machine.txt
            benchmarks/system-packages.txt
            benchmarks/gpu.txt
            benchmarks/success.txt
          retention-days: 30
          if-no-files-found: warn

  benchmark-upload:
    name: Publish ${{ matrix.device }} benchmark${{ matrix.python != '3.10.20' && format(' (Python {0})', matrix.python) || '' }}
    runs-on: ubuntu-latest
    needs: benchmark
    # One failed device must not suppress another device's successful history.
    # Branch/manual validation never enters the main trend.
    if: ${{ !cancelled() && !inputs.skip-upload && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      # Each job pushes to gh-pages; serialize writes within this workflow run.
      max-parallel: 1
      matrix:
        python: ${{ fromJSON((github.event_name == 'push' || inputs.suite == 'async') && '["3.10.20"]' || '["3.10.20","3.12.16"]') }}
        device: [CPU, GPU]
    env:
      BENCHMARK_ARTIFACT: ${{ format('{0}-benchmark-results{1}', matrix.device, matrix.python != '3.10.20' && format('-py{0}', matrix.python) || '') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BENCHMARK_ARTIFACT }}
          path: results
      - name: Store benchmark results
        if: ${{ !cancelled() && hashFiles(format('results/{0}/success.txt', env.BENCHMARK_ARTIFACT)) != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: ${{ env.BENCHMARK_SUITE == 'async' && format('Async {0} (v1)', matrix.device) || matrix.python == '3.10.20' && format('{0} Benchmark Results', matrix.device) || format('{0} Benchmark Results (Python {1})', matrix.device, matrix.python) }}
          tool: ${{ env.BENCHMARK_SUITE == 'async' && 'customBiggerIsBetter' || 'pytest' }}
          output-file-path: ${{ format('results/{0}/{1}', env.BENCHMARK_ARTIFACT, env.BENCHMARK_SUITE == 'async' && 'trend.json' || 'output.json') }}
          benchmark-data-dir-path: ${{ env.BENCHMARK_SUITE == 'async' && 'dev/bench/async' || matrix.python == '3.10.20' && 'dev/bench' || format('dev/bench/py{0}', matrix.python) }}
          fail-on-alert: false
          alert-threshold: '200%'
          comment-on-alert: false
          summary-always: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Label the point with the benchmarked commit, not main at upload time.
          ref: ${{ github.sha }}
          gh-pages-branch: gh-pages
          auto-push: true
          max-items-in-chart: 250
